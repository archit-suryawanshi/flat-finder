name: Add a city
run-name: "Add ${{ inputs.city }}"

# Type a city name, press Run. The workflow finds the city, fetches its housing societies (Magicbricks where it
# covers the city, OpenStreetMap everywhere else), builds the map data, commits it and redeploys the site.
on:
  workflow_dispatch:
    inputs:
      city:
        description: "City name, e.g. Pune, Hyderabad, Jaipur, Lisbon (add the country if the name is ambiguous)"
        required: true
        type: string
      max_projects:
        description: "Most Magicbricks projects to crawl (0 = all; big cities have 30,000 and take hours)"
        required: false
        default: "3000"
        type: string
      osm_only:
        description: "Skip Magicbricks and use OpenStreetMap only"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  statuses: write
  pages: write
  id-token: write

# Runs for different cities go in parallel (GitHub keeps only one queued run per group, so a single shared group
# silently cancelled cities). Two runs for the same city still queue.
concurrency:
  group: add-city-${{ inputs.city }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and build ${{ inputs.city }}
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          CITY: ${{ inputs.city }}
          MAX: ${{ inputs.max_projects }}
          OSM_ONLY: ${{ inputs.osm_only }}
        run: |
          args=("$CITY")
          if [ "$MAX" = "0" ]; then args+=(--all); else args+=(--max "$MAX"); fi
          if [ "$OSM_ONLY" = "true" ]; then args+=(--osm-only); fi
          # GitHub shows a job's log only when it ends, so post the latest progress line as a commit status every
          # minute: readable live with  gh api repos/<repo>/commits/<sha>/statuses
          (while sleep 60; do
            line=$(grep -E "Stage|pages [0-9]|areas|buildings|pois|complexes|mirror|retry" progress.log 2>/dev/null | tail -1 | cut -c1-135)
            stage=$(grep -E "^Stage" progress.log 2>/dev/null | tail -1 | cut -c1-20)
            gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context="add-city/$CITY" \
              -f description="${stage:+$stage | }${line:-starting}" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null || true
          done) &
          reporter=$!
          set +e
          cd pipeline && python3 -u add_city.py "${args[@]}" 2>&1 | tee ../progress.log
          status=${PIPESTATUS[0]}
          set -e
          kill $reporter 2>/dev/null || true
          state=$([ "$status" = 0 ] && echo success || echo failure)
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=$state -f context="add-city/$CITY" -f description="finished: $state" >/dev/null || true
          exit $status
      - name: Commit the new city
        env:
          CITY: ${{ inputs.city }}
          ID: ${{ steps.build.outputs.city_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          python3 -c "import json,os; json.dump(json.load(open('data/cities.json'))[os.environ['ID']], open(os.environ['RUNNER_TEMP'] + '/entry.json', 'w'))"
          # the shared city lists are rebuilt on top of the newest main; only this city's own files are carried over
          git checkout -- data/cities.json web/public/data/cities.json
          git add -A web/public/data pipeline/out/"$ID"
          git stash
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            # same city added again: this run's files win
            git stash apply -q || { git reset -q --hard origin/main && git checkout stash@{0} -- web/public/data pipeline/out/"$ID"; }
            (cd pipeline && python3 register_city.py "$ID" "$RUNNER_TEMP/entry.json")
            git add -A data/cities.json web/public/data pipeline/out/"$ID"
            git commit -q -m "Add city: $CITY" || { echo "nothing new to commit"; exit 0; }
            git push -q origin HEAD:main && exit 0
            echo "main moved on, retrying"; sleep $((RANDOM % 20 + 5))
          done
          exit 1
  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
